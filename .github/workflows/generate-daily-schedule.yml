name: Generate daily schedule

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tools/generate-daily-schedule.mjs --write --days=400
      - run: node tools/sync-wordlinks-bundle.mjs
      - run: node tools/verify-website.mjs
      - name: Commit new daily files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/daily/v1
          git diff --cached --quiet || git commit -m 'Generate future daily puzzles'
          git push
